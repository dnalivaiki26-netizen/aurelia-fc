<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Aurelia Football 11.0</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
 margin:0;background:#071225;color:white;font-family:Arial,sans-serif;
 overflow:hidden;touch-action:none
}
button{
 border:0;border-radius:14px;padding:14px 20px;font-weight:800;
 background:#e9b93f;color:#101827;font-size:16px
}
#app{width:100vw;height:100vh;position:relative;overflow:hidden}
.screen{display:none;width:100%;height:100%;position:absolute}
.screen.active{display:block}

.menu{
 background:linear-gradient(145deg,#061126,#123b82);
 display:flex;align-items:center;justify-content:center;
 text-align:center;padding:25px
}
.logo{
 font-size:46px;font-weight:1000;color:#e9b93f;
 text-shadow:0 4px 15px #000;margin-bottom:5px
}
.sub{opacity:.8;margin-bottom:35px}
.menu button{display:block;width:270px;margin:12px auto}

.top{
 position:absolute;top:0;left:0;right:0;height:65px;
 background:rgba(3,10,25,.9);display:flex;align-items:center;
 justify-content:space-between;padding:10px 15px;z-index:20
}
.score{font-size:23px;font-weight:900}
.timer{font-size:14px;opacity:.8}

#game{background:#183f20}
canvas{width:100%;height:100%;display:block}

.controls{
 position:absolute;bottom:20px;left:0;right:0;height:180px;
 pointer-events:none
}
.joy{
 position:absolute;left:25px;bottom:20px;width:125px;height:125px;
 border-radius:50%;background:rgba(255,255,255,.12);
 border:2px solid rgba(255,255,255,.25);pointer-events:auto
}
.knob{
 position:absolute;left:37px;top:37px;width:47px;height:47px;
 border-radius:50%;background:rgba(255,255,255,.65)
}
.actions{
 position:absolute;right:18px;bottom:12px;
 display:grid;grid-template-columns:75px 75px;gap:10px;
 pointer-events:auto
}
.actions button{
 width:75px;height:55px;padding:5px;border-radius:50%;
 background:rgba(255,255,255,.2);color:white;
 border:2px solid rgba(255,255,255,.35)
}
.actions .shoot{background:#d63e45}
.actions .pass{background:#2475d9}
.actions .tackle{background:#e9b93f;color:#111}
.actions .sprint{background:#38a96b}

#pauseBtn{
 position:absolute;right:15px;top:75px;width:48px;height:42px;
 padding:0;background:rgba(0,0,0,.5);color:white
}

.panel{
 background:linear-gradient(145deg,#071226,#12336b);
 padding:25px;overflow:auto
}
.card{
 background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
 border-radius:18px;padding:18px;margin:12px 0
}
.player{
 display:flex;justify-content:space-between;padding:12px;
 border-bottom:1px solid rgba(255,255,255,.1)
}
.rating{color:#e9b93f;font-weight:900}

.result{
 display:flex;align-items:center;justify-content:center;
 text-align:center;background:linear-gradient(145deg,#061126,#123b82)
}
.bigscore{font-size:70px;font-weight:1000;margin:20px 0}
</style>
</head>

<body>
<div id="app">

<!-- MENU -->
<section id="menu" class="screen active menu">
 <div>
  <div class="logo">AURELIA</div>
  <div style="font-size:23px;font-weight:900">FOOTBALL 11.0</div>
  <div class="sub">Aurelia FC • Valencia</div>

  <button onclick="startMatch()">⚽ БЫСТРЫЙ МАТЧ</button>
  <button onclick="showTeam()">👥 СОСТАВ</button>
  <button onclick="showCareer()">🏆 КАРЬЕРА</button>
 </div>
</section>

<!-- TEAM -->
<section id="team" class="screen panel">
 <h1>👥 Aurelia FC</h1>
 <div class="card">
  <b>Схема</b>
  <h2>4-3-3</h2>
  <p>Атака 82 • Полузащита 79 • Защита 76</p>
 </div>
 <div class="card" id="players"></div>
 <button onclick="backMenu()">← Назад</button>
</section>

<!-- CAREER -->
<section id="career" class="screen panel">
 <h1>🏆 Карьера</h1>
 <div class="card">
  <h2>Aurelia FC</h2>
  <p>Сезон: 2026/27</p>
  <p>Матчи: <b id="careerGames">0</b></p>
  <p>Победы: <b id="careerWins">0</b></p>
  <p>Голы: <b id="careerGoals">0</b></p>
  <p>Бюджет: <b>€85M</b></p>
 </div>
 <div class="card">
  <h2>🏟️ Aurelia Arena</h2>
  <p>Вместимость: 52 000</p>
  <p>Форма: Adidas</p>
 </div>
 <button onclick="backMenu()">← Назад</button>
</section>

<!-- GAME -->
<section id="game" class="screen">
 <div class="top">
  <div class="score"><span id="homeScore">0</span> — <span id="awayScore">0</span></div>
  <div class="timer" id="timer">03:00</div>
  <div>🔵 AURELIA</div>
 </div>

 <button id="pauseBtn" onclick="togglePause()">Ⅱ</button>

 <canvas id="field"></canvas>

 <div class="controls">
  <div class="joy" id="joy"><div class="knob" id="knob"></div></div>

  <div class="actions">
   <button class="pass" id="pass">PASS</button>
   <button class="shoot" id="shoot">SHOT</button>
   <button class="tackle" id="tackle">TACKLE</button>
   <button class="sprint" id="sprint">SPRINT</button>
  </div>
 </div>
</section>

<!-- RESULT -->
<section id="result" class="screen result">
 <div>
  <div style="font-size:25px;font-weight:900">МАТЧ ОКОНЧЕН</div>
  <div class="bigscore" id="finalScore">0 — 0</div>
  <div id="resultText"></div>
  <br>
  <button onclick="startMatch()">🔄 Новый матч</button>
  <button onclick="backMenu()">🏠 Меню</button>
 </div>
</section>

</div>

<script>
const canvas=document.getElementById("field");
const ctx=canvas.getContext("2d");

let W,H;
function resize(){
 W=canvas.width=innerWidth*devicePixelRatio;
 H=canvas.height=innerHeight*devicePixelRatio;
 canvas.style.width=innerWidth+"px";
 canvas.style.height=innerHeight+"px";
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
 W=innerWidth;H=innerHeight;
}
addEventListener("resize",resize);
resize();

const players=[
 ["Mateo Soler","GK",80],
 ["Leo Vidal","DEF",78],
 ["Marco Ruiz","DEF",77],
 ["Ivan Torres","DEF",75],
 ["Luis Navarro","DEF",76],
 ["Hugo Ferrer","MID",81],
 ["Carlos Vega","MID",79],
 ["Bruno Santos","MID",78],
 ["Alejandro Rey","FWD",86],
 ["Daniel Costa","FWD",83],
 ["Mateo Silva","FWD",80]
];

function showTeam(){
 hideAll();team.classList.add("active");
 document.getElementById("players").innerHTML=
 players.map((p,i)=>`
 <div class="player">
  <span>${i+1}. ${p[0]} <small>${p[1]}</small></span>
  <span class="rating">${p[2]}</span>
 </div>`).join("");
}

let career=JSON.parse(localStorage.getItem("aureliaCareer")||'{"games":0,"wins":0,"goals":0}');

function showCareer(){
 hideAll();career.classList.add("active");
 careerGames.textContent=career.games;
 careerWins.textContent=career.wins;
 careerGoals.textContent=career.goals;
}

function hideAll(){
 document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
}
function backMenu(){hideAll();menu.classList.add("active")}

let gameRunning=false,paused=false;
let timeLeft=180;
let home=0,away=0;
let last=0;

const ball={x:.5,y:.5,vx:0,vy:0,owner:0};
let user={x:.35,y:.5,vx:0,vy:0,energy:100};
let mates=[];
let enemies=[];
let keeper={x:.94,y:.5};

function resetPlayers(){
 mates=[
  {x:.25,y:.28},{x:.25,y:.72},{x:.38,y:.35},
  {x:.38,y:.65},{x:.48,y:.5},{x:.57,y:.28},
  {x:.57,y:.72},{x:.68,y:.4},{x:.68,y:.6}
 ];

 enemies=[
  {x:.75,y:.25},{x:.78,y:.38},{x:.82,y:.5},
  {x:.78,y:.62},{x:.75,y:.75},{x:.63,y:.3},
  {x:.63,y:.7},{x:.55,y:.45},{x:.88,y:.5}
 ];
}

function startMatch(){
 hideAll();game.classList.add("active");
 home=away=0;timeLeft=180;paused=false;
 user={x:.32,y:.5,vx:0,vy:0,energy:100};
 ball.x=.5;ball.y=.5;ball.vx=ball.vy=0;ball.owner=0;
 keeper={x:.94,y:.5};
 resetPlayers();
 gameRunning=true;
 last=performance.now();
 requestAnimationFrame(loop);
}

function togglePause(){
 paused=!paused;
 document.getElementById("pauseBtn").textContent=paused?"▶":"Ⅱ";
}

function fieldPos(x,y){
 return [x*W,y*H];
}

function drawField(){
 ctx.fillStyle="#17652d";
 ctx.fillRect(0,0,W,H);

 for(let i=0;i<12;i++){
  ctx.fillStyle=i%2?"#1b7133":"#17652d";
  ctx.fillRect(i*W/12,65,(W/12)+1,H-65);
 }

 ctx.strokeStyle="rgba(255,255,255,.85)";
 ctx.lineWidth=3;

 ctx.strokeRect(25,80,W-50,H-110);

 ctx.beginPath();
 ctx.moveTo(W/2,80);ctx.lineTo(W/2,H-30);ctx.stroke();

 ctx.beginPath();
 ctx.arc(W/2,(H+50)/2,70,0,Math.PI*2);ctx.stroke();

 ctx.strokeRect(25,(H+50)/2-100,100,200);
 ctx.strokeRect(W-125,(H+50)/2-100,100,200);

 ctx.fillStyle="rgba(255,255,255,.85)";
 ctx.fillRect(8,(H+50)/2-38,17,76);
 ctx.fillRect(W-25,(H+50)/2-38,17,76);
}

function circle(x,y,r,color){
 ctx.beginPath();ctx.arc(x*W,y*H,r,0,Math.PI*2);
 ctx.fillStyle=color;ctx.fill();
}

function drawPlayer(x,y,color,r=13){
 circle(x,y,r,color);
 ctx.strokeStyle="white";ctx.lineWidth=2;
 ctx.stroke();
}

function draw(){
 ctx.clearRect(0,0,W,H);
 drawField();

 // teammates
 mates.forEach((p,i)=>{
  drawPlayer(p.x,p.y,"#2166ff",11);
  ctx.fillStyle="white";ctx.font="10px Arial";
  ctx.fillText(i+1,p.x*W-3,p.y*H+3);
 });

 // opponents
 enemies.forEach(p=>drawPlayer(p.x,p.y,"#e43d45",11));

 // goalkeeper
 drawPlayer(keeper.x,keeper.y,"#ffd34d",14);

 // controlled player
 drawPlayer(user.x,user.y,"#51a7ff",16);
 ctx.strokeStyle="#ffd34d";ctx.lineWidth=3;
 ctx.beginPath();ctx.arc(user.x*W,user.y*H,21,0,Math.PI*2);ctx.stroke();

 // ball
 circle(ball.x,ball.y,7,"#fff");
 ctx.strokeStyle="#111";ctx.lineWidth=1;
 ctx.stroke();

 // stamina
 ctx.fillStyle="rgba(0,0,0,.5)";
 ctx.fillRect(20,75,120,8);
 ctx.fillStyle="#4ce27b";
 ctx.fillRect(20,75,120*(user.energy/100),8);
}

let joyX=0,joyY=0,sprinting=false;

const joy=document.getElementById("joy");
const knob=document.getElementById("knob");

function joyMove(e){
 const r=joy.getBoundingClientRect();
 const t=e.touches?e.touches[0]:e;
 let dx=t.clientX-(r.left+r.width/2);
 let dy=t.clientY-(r.top+r.height/2);
 const max=42;
 const len=Math.hypot(dx,dy);
 if(len>max){dx=dx/len*max;dy=dy/len*max}
 knob.style.transform=`translate(${dx}px,${dy}px)`;
 joyX=dx/max;joyY=dy/max;
}

function joyEnd(){
 joyX=joyY=0;
 knob.style.transform="translate(0,0)";
}

joy.addEventListener("touchstart",e=>{e.preventDefault();joyMove(e)});
joy.addEventListener("touchmove",e=>{e.preventDefault();joyMove(e)});
joy.addEventListener("touchend",joyEnd);

document.getElementById("sprint").addEventListener("touchstart",e=>{
 e.preventDefault();sprinting=true
});
document.getElementById("sprint").addEventListener("touchend",()=>sprinting=false);

document.getElementById("pass").addEventListener("touchstart",e=>{
 e.preventDefault();passBall();
});

document.getElementById("shoot").addEventListener("touchstart",e=>{
 e.preventDefault();shootBall();
});

document.getElementById("tackle").addEventListener("touchstart",e=>{
 e.preventDefault();tackle();
});

function distance(a,b){
 return Math.hypot(a.x-b.x,a.y-b.y);
}

function passBall(){
 if(ball.owner!==0)return;

 let best=null,bd=999;
 mates.forEach(p=>{
  const d=distance(user,p);
  if(d<bd){bd=d;best=p}
 });
 if(best){
  ball.vx=(best.x-user.x)*3;
  ball.vy=(best.y-user.y)*3;
  ball.owner=0;
 }
}

function shootBall(){
 if(distance(user,ball)<.08 || ball.owner===0){
  ball.owner=0;
  const targetX=1;
  ball.vx=3.8;
  ball.vy=(.5-user.y)*2.8;
 }
}

function tackle(){
 enemies.forEach(p=>{
  if(distance(user,p)<.07 && ball.owner===2){
   ball.owner=0;
   ball.x=user.x;
   ball.y=user.y;
   ball.vx=.7;
   ball.vy=joyY;
  }
 });
}

function update(dt){
 if(paused)return;

 // player movement
 let speed=sprinting&&user.energy>0?.34:.22;
 if(sprinting&&Math.hypot(joyX,joyY)>.1)user.energy-=30*dt;
 else user.energy+=18*dt;
 user.energy=Math.max(0,Math.min(100,user.energy));

 user.x+=joyX*speed*dt;
 user.y+=joyY*speed*dt;

 user.x=Math.max(.06,Math.min(.94,user.x));
 user.y=Math.max(.14,Math.min(.86,user.y));

 // ball following player
 if(distance(user,ball)<.075 && Math.hypot(ball.vx,ball.vy)<1.2){
  ball.x=user.x+joyX*.045;
  ball.y=user.y+joyY*.045;
  ball.vx=joyX*.3;
  ball.vy=joyY*.3;
 }

 // ball physics
 ball.x+=ball.vx*dt;
 ball.y+=ball.vy*dt;
 ball.vx*=Math.pow(.08,dt);
 ball.vy*=Math.pow(.08,dt);

 // enemy AI
 enemies.forEach(p=>{
  let target={x:.5,y:.5};

  if(ball.x>.55){
   target=ball;
  }else{
   target={x:.48,y:.5};
  }

  const dx=target.x-p.x,dy=target.y-p.y;
  const d=Math.hypot(dx,dy)||1;

  p.x+=dx/d*.10*dt;
  p.y+=dy/d*.10*dt;

  if(distance(p,ball)<.035 && ball.owner===0){
   ball.owner=2;
   ball.vx=ball.vy=0;
  }

  if(ball.owner===2 && distance(p,ball)<.03){
   ball.vx=-.7;
   ball.vy=(.5-ball.y)*1.3;
   ball.owner=2;
  }
 });

 // goalkeeper
 keeper.y += (.5-ball.y)*.7*dt;
 keeper.y=Math.max(.22,Math.min(.78,keeper.y));

 // goals
 if(ball.x>.975 && ball.y>.38 && ball.y<.62){
  home++;
  goalReset(1);
 }
 if(ball.x<.025 && ball.y>.38 && ball.y<.62){
  away++;
  goalReset(2);
 }

 ball.x=Math.max(.02,Math.min(.98,ball.x));
 ball.y=Math.max(.13,Math.min(.87,ball.y));
}

function goalReset(team){
 document.getElementById("homeScore").textContent=home;
 document.getElementById("awayScore").textContent=away;

 ball.x=.5;ball.y=.5;ball.vx=ball.vy=0;ball.owner=0;
 user.x=.32;user.y=.5;
 resetPlayers();
}

function loop(now){
 if(!gameRunning)return;

 const dt=Math.min((now-last)/1000,.05);
 last=now;

 if(!paused){
  timeLeft-=dt;
  if(timeLeft<=0){
   timeLeft=0;
   finishMatch();
   return;
  }
 }

 const min=Math.floor(timeLeft/60);
 const sec=Math.floor(timeLeft%60);
 document.getElementById("timer").textContent=
  `${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;

 update(dt);
 draw();
 requestAnimationFrame(loop);
}

function finishMatch(){
 gameRunning=false;
 career.games++;
 career.goals+=home;
 if(home>away)career.wins++;
 localStorage.setItem("aureliaCareer",JSON.stringify(career));

 hideAll();result.classList.add("active");

 document.getElementById("finalScore").textContent=`${home} — ${away}`;

 document.getElementById("resultText").textContent=
  home>away?"🏆 Победа Aurelia FC!":
  home<away?"😕 Поражение":"🤝 Ничья";
}
</script>
</body>
</html>

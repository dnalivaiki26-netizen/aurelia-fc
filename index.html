<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Aurelia FC v2.0</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#07152f;color:white;font-family:Arial,sans-serif;
 overflow:hidden;touch-action:none
}
button{
 border:0;border-radius:14px;background:#12356d;color:white;
 font-size:18px;font-weight:bold;padding:14px 20px
}
.screen{display:none;width:100vw;height:100vh}
.active{display:flex}
#menu{
 flex-direction:column;align-items:center;justify-content:center;
 background:linear-gradient(#06132d,#0d2c61)
}
.logo{
 font-size:42px;font-weight:900;color:#ffd447;
 text-shadow:0 3px 10px #000;margin-bottom:8px
}
.subtitle{font-size:18px;margin-bottom:35px}
#game{position:relative;background:#168044}
#field{
 position:absolute;inset:0;
 background:
 linear-gradient(90deg,transparent 49.7%,rgba(255,255,255,.8) 49.7%,rgba(255,255,255,.8) 50.3%,transparent 50.3%),
 repeating-linear-gradient(0deg,#168044 0,#168044 8%,#197f43 8%,#197f43 16%);
}
.line{position:absolute;border:2px solid rgba(255,255,255,.8)}
.center{width:18vh;height:18vh;border-radius:50%;left:calc(50% - 9vh);top:calc(50% - 9vh)}
.goal{
 position:absolute;top:38%;height:24%;width:5%;
 border:4px solid white;background:rgba(255,255,255,.12)
}
.goal.left{left:0}.goal.right{right:0}
#hud{
 position:absolute;top:10px;left:50%;transform:translateX(-50%);
 z-index:10;background:rgba(0,0,0,.65);padding:10px 18px;
 border-radius:15px;text-align:center;min-width:210px
}
#score{font-size:23px;font-weight:bold}
#time{font-size:14px;margin-top:3px}
.player,.enemy,.mate,#ball{
 position:absolute;transform:translate(-50%,-50%);
 border-radius:50%;z-index:4
}
.player{width:38px;height:38px;background:#075eff;border:3px solid white}
.mate{width:30px;height:30px;background:#2580ff;border:2px solid white}
.enemy{width:32px;height:32px;background:#e22;border:2px solid white}
#ball{width:16px;height:16px;background:white;border:2px solid #222;z-index:7}
#controls{
 position:absolute;inset:0;z-index:20;pointer-events:none
}
#joy{
 pointer-events:auto;position:absolute;left:25px;bottom:25px;
 width:145px;height:145px;border-radius:50%;
 background:rgba(255,255,255,.16);
 border:2px solid rgba(255,255,255,.4)
}
#stick{
 position:absolute;width:62px;height:62px;border-radius:50%;
 background:rgba(255,255,255,.75);
 left:41px;top:41px
}
.action{
 pointer-events:auto;position:absolute;border-radius:50%;
 width:72px;height:72px;padding:0;
 background:rgba(8,30,70,.8);border:2px solid rgba(255,255,255,.5)
}
#shoot{right:28px;bottom:105px}
#pass{right:115px;bottom:38px}
#sprint{right:28px;bottom:20px;width:65px;height:65px;font-size:13px}
#pause{position:absolute;right:12px;top:12px;z-index:30;padding:9px 13px}
#end{
 position:absolute;inset:0;background:rgba(0,0,0,.8);
 z-index:50;display:none;align-items:center;justify-content:center;
 flex-direction:column;text-align:center
}
#end h1{font-size:38px;color:#ffd447}
.bar{
 position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
 width:180px;height:8px;background:#333;border-radius:8px;overflow:hidden
}
#stamina{height:100%;background:#ffd447;width:100%}
</style>
</head>

<body>

<div id="menu" class="screen active">
 <div class="logo">👑 AURELIA FC</div>
 <div class="subtitle">VALENCIA • ESPAÑA</div>
 <button onclick="startGame()">⚽ НАЧАТЬ МАТЧ</button>
</div>

<div id="game" class="screen">
 <div id="field">
  <div class="line center"></div>
  <div class="goal left"></div>
  <div class="goal right"></div>

  <div id="ball"></div>
  <div id="player" class="player"></div>

  <div id="m1" class="mate"></div>
  <div id="m2" class="mate"></div>

  <div id="e1" class="enemy"></div>
  <div id="e2" class="enemy"></div>
  <div id="e3" class="enemy"></div>
  <div id="e4" class="enemy"></div>
 </div>

 <div id="hud">
  <div id="score">AURELIA 0 : 0 RIVAL</div>
  <div id="time">90:00</div>
 </div>

 <button id="pause" onclick="togglePause()">Ⅱ</button>

 <div id="controls">
  <div id="joy"><div id="stick"></div></div>

  <button id="shoot" class="action">⚽</button>
  <button id="pass" class="action">↗</button>
  <button id="sprint" class="action">⚡</button>

  <div class="bar"><div id="stamina"></div></div>
 </div>

 <div id="end">
  <h1>МАТЧ ОКОНЧЕН</h1>
  <div id="finalScore"></div>
  <br>
  <button onclick="location.reload()">🏠 В МЕНЮ</button>
 </div>
</div>

<script>
const player=document.getElementById("player");
const ball=document.getElementById("ball");
const stick=document.getElementById("stick");
const joy=document.getElementById("joy");
const staminaBar=document.getElementById("stamina");

let W,H;
let px=25,py=50;
let bx=29,by=50;
let vx=0,vy=0;
let scoreA=0,scoreB=0;
let seconds=0;
let running=false,paused=false,sprinting=false;
let stamina=100;

const mates=[
 {el:document.getElementById("m1"),x:38,y:30},
 {el:document.getElementById("m2"),x:38,y:70}
];

const enemies=[
 {el:document.getElementById("e1"),x:55,y:25},
 {el:document.getElementById("e2"),x:62,y:45},
 {el:document.getElementById("e3"),x:55,y:65},
 {el:document.getElementById("e4"),x:72,y:50}
];

let dx=0,dy=0;

function resize(){
 W=innerWidth;H=innerHeight;
}
addEventListener("resize",resize);
resize();

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

function render(){
 player.style.left=px+"%";
 player.style.top=py+"%";

 ball.style.left=bx+"%";
 ball.style.top=by+"%";

 mates.forEach(m=>{
  m.el.style.left=m.x+"%";
  m.el.style.top=m.y+"%";
 });

 enemies.forEach(e=>{
  e.el.style.left=e.x+"%";
  e.el.style.top=e.y+"%";
 });
}

function startGame(){
 document.getElementById("menu").classList.remove("active");
 document.getElementById("game").classList.add("active");
 running=true;
 render();
 requestAnimationFrame(loop);
}

function loop(){
 if(!running)return;

 if(!paused){
  update();
 }

 requestAnimationFrame(loop);
}

function update(){
 let speed=.20;

 if(sprinting && stamina>0){
  speed=.34;
  stamina-=.45;
 }else{
  stamina+=.20;
 }

 stamina=clamp(stamina,0,100);
 staminaBar.style.width=stamina+"%";

 px+=dx*speed;
 py+=dy*speed;

 px=clamp(px,4,96);
 py=clamp(py,7,93);

 // мяч следует за игроком, если рядом
 let dist=Math.hypot(px-bx,py-by);

 if(dist<5){
  bx=px+2;
  by=py;
 }

 // движение мяча
 bx+=vx;
 by+=vy;
 vx*=.94;
 vy*=.94;

 if(by<5||by>95)vy*=-.8;

 // соперники идут к мячу
 enemies.forEach(e=>{
  let ex=bx-e.x;
  let ey=by-e.y;
  let d=Math.hypot(ex,ey)||1;

  e.x+=ex/d*.055;
  e.y+=ey/d*.055;

  if(Math.hypot(e.x-bx,e.y-by)<3.5){
   bx-=.10;
  }
 });

 // товарищи двигаются вперёд
 mates[0].x+=.025;
 mates[1].x+=.025;

 mates.forEach(m=>{
  if(m.x>90)m.x=30;
 });

 // гол
 if(bx>97){
  scoreA++;
  goal();
 }

 if(bx<3){
  scoreB++;
  goal();
 }

 seconds+=1/60;

 let remaining=Math.max(0,180-seconds);
 let min=Math.floor(remaining/60);
 let sec=Math.floor(remaining%60);

 document.getElementById("time").textContent=
  min+":"+String(sec).padStart(2,"0");

 document.getElementById("score").textContent=
  "AURELIA "+scoreA+" : "+scoreB+" RIVAL";

 if(seconds>=180)finish();

 render();
}

function goal(){
 bx=50;by=50;vx=0;vy=0;
}

function finish(){
 running=false;
 document.getElementById("finalScore").textContent=
  "AURELIA "+scoreA+" : "+scoreB+" RIVAL";
 document.getElementById("end").style.display="flex";
}

function togglePause(){
 paused=!paused;
 document.getElementById("pause").textContent=paused?"▶":"Ⅱ";
}

// ---------- ДЖОЙСТИК ----------

let joyActive=false;

function joystick(e){
 const r=joy.getBoundingClientRect();
 const cx=r.left+r.width/2;
 const cy=r.top+r.height/2;

 let x=e.clientX-cx;
 let y=e.clientY-cy;

 const max=52;
 const d=Math.hypot(x,y);

 if(d>max){
  x=x/d*max;
  y=y/d*max;
 }

 stick.style.transform=`translate(${x}px,${y}px)`;

 dx=x/max;
 dy=y/max;
}

joy.addEventListener("pointerdown",e=>{
 joyActive=true;
 joy.setPointerCapture(e.pointerId);
 joystick(e);
});

joy.addEventListener("pointermove",e=>{
 if(joyActive)joystick(e);
});

function joyEnd(){
 joyActive=false;
 dx=0;
 dy=0;
 stick.style.transform="translate(0,0)";
}

joy.addEventListener("pointerup",joyEnd);
joy.addEventListener("pointercancel",joyEnd);

// ---------- СПРИНТ ----------

const sprint=document.getElementById("sprint");

sprint.addEventListener("pointerdown",()=>{
 sprinting=true;
});

sprint.addEventListener("pointerup",()=>{
 sprinting=false;
});

sprint.addEventListener("pointercancel",()=>{
 sprinting=false;
});

// ---------- УДАР ----------

document.getElementById("shoot").addEventListener("pointerdown",()=>{
 if(!running||paused)return;

 let sx=dx;
 let sy=dy;

 if(Math.abs(sx)+Math.abs(sy)<.1){
  sx=1;
  sy=0;
 }

 let d=Math.hypot(sx,sy)||1;

 vx=sx/d*.75;
 vy=sy/d*.75;

 bx=px+sx/d*4;
 by=py+sy/d*4;
});

// ---------- ПАС ----------

document.getElementById("pass").addEventListener("pointerdown",()=>{
 if(!running||paused)return;

 let target=mates[0];

 if(Math.abs(target.x-px)>Math.abs(mates[1].x-px))
  target=mates[1];

 bx=target.x;
 by=target.y;
 vx=.25;
 vy=(target.y-py)*.01;
});

// предотвращаем масштабирование
document.addEventListener("gesturestart",e=>e.preventDefault());

render();
</script>

</body>
</html>
